<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>BRAKE, NOT BREAK!</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main id="game" aria-label="BRAKE, NOT BREAK! Downhill braking game" data-state="ready">
    <canvas id="road" aria-hidden="true"></canvas>
    <output id="distance" class="live-distance" aria-label="Current distance" aria-live="off">0 m</output>
    <header class="hud" aria-label="Best score">
      <div>Best <output id="best">0 m</output></div>
    </header>
    <button id="mute" class="sound-toggle" type="button" aria-label="Mute sound" aria-pressed="false">
      <img id="sound-icon" src="assets/icon/sound%20on.svg" alt="" width="24" height="24">
    </button>
    <div class="menu">
      <button class="primary" id="play" type="button">Start</button>
    </div>
    <p id="hint" hidden>Hold to brake</p>
  </main>
</body>
</html>
