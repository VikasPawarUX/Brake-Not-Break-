<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>BRAKE!</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main id="game" aria-label="BRAKE! Downhill braking game" data-state="ready">
    <canvas id="road" aria-hidden="true"></canvas>
    <div id="live-distance" class="live-distance" hidden>
      <output id="distance" aria-label="Current distance" aria-live="off">0 m</output>
      <span class="distance-leader" aria-hidden="true"></span>
    </div>
    <header class="hud" aria-label="Best score">
      <div>Best <output id="best">0 m</output></div>
    </header>
    <div class="tools">
      <button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">Sound on</button>
    </div>
    <section class="menu" id="menu" aria-labelledby="game-title">
      <div class="menu-copy">
        <h1 id="game-title">BRAKE!</h1>
        <p id="message">One road. Five cars. One brake.</p>
      </div>
      <button class="primary" id="play" type="button">Play</button>
    </section>
    <p id="hint" hidden>Hold to brake</p>
  </main>
</body>
</html>
