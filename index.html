<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Bumper to Bumper</title>
  <link rel="icon" type="image/x-icon" href="assets/icon/game-favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/game-favicon.png">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('brake.theme') === 'light' ? 'light' : 'dark';
    } catch {}
  </script>
  <link rel="stylesheet" href="style.css?v=larger-touch-ring">
  <script src="leaderboard-config.js" defer></script>
  <script src="leaderboard.js?v=compact-flags" defer></script>
  <script src="radio.js?v=quieter-mix" defer></script>
  <script src="game.js?v=restart-crossfade" defer></script>
</head>
<body>
  <div id="launch-screen" role="status" aria-label="Loading">
    <div class="launch-content">
      <img class="launch-logo" src="assets/icon/gameicon.jpg?v=assets-2" alt="" width="512" height="512">
      <div class="launch-progress" aria-hidden="true"></div>
    </div>
    <p class="launch-copyright">© 2026 Vikas Pawar</p>
  </div>
  <main id="game" inert aria-label="Bumper to Bumper Downhill braking game" data-state="ready">
    <canvas id="road" aria-hidden="true"></canvas>
    <canvas class="foreground-overlay" aria-hidden="true"></canvas>
    <canvas class="crash-overlay" aria-hidden="true" hidden></canvas>
    <output id="distance" class="live-distance" aria-label="Current distance" aria-live="off">0m</output>
    <div class="menu">
      <section class="control-panel" aria-label="Game controls">
        <p id="panel-status" class="panel-status">Ready for the ride?</p>
        <dl class="panel-stats">
          <div class="panel-best"><dt>Best Score</dt><dd id="panel-best">0m</dd></div>
          <div id="rank-stat" hidden><dt>Rank:</dt><dd id="player-rank"></dd></div>
        </dl>
        <div class="panel-actions">
          <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch to Light theme" title="Switch to Light theme">
            <img id="theme-icon" src="assets/icon/light.svg" alt="" width="24" height="24">
          </button>
          <button id="edit-driver" class="icon-button" type="button" aria-label="Edit driver name" aria-haspopup="dialog">
            <img src="assets/icon/driver.svg?v=assets-2" alt="" width="24" height="24">
          </button>
          <button id="mute" class="icon-button" type="button" aria-label="Mute sound" aria-pressed="false">
            <img id="sound-icon" src="assets/icon/sound%20on.svg?v=assets-2" alt="" width="24" height="24">
          </button>
          <button class="primary" id="play" type="button" aria-keyshortcuts="Enter">
            <img id="play-icon" src="assets/icon/start.svg?v=assets-2" alt="" width="22" height="22">
            <span id="play-label">Start</span>
          </button>
        </div>
        <section class="bumper-radio" aria-label="Bumper FM Roadwave">
          <div class="radio-controls">
            <button class="radio-prev" type="button" aria-label="Previous radio station"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m10 4-4 4 4 4"/></svg></button>
            <output class="radio-station" aria-live="polite" aria-atomic="true">
              <span class="radio-title">OFF</span>
              <span class="radio-subtitle">Radio Off</span>
            </output>
            <button class="radio-next" type="button" aria-label="Next radio station"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 4 4 4-4 4"/></svg></button>
          </div>
        </section>
      </section>
      <section id="leaderboard" aria-labelledby="leaderboard-title" hidden>
        <h2 id="leaderboard-title">Today’s Top 10 Drivers</h2>
        <p id="leaderboard-status" role="status"></p>
        <div class="leaderboard-strip" hidden>
          <button id="scores-prev" class="icon-button" type="button" aria-label="Scroll leaderboard left" aria-controls="leaderboard-scores">‹</button>
          <ol id="leaderboard-scores" tabindex="0" aria-label="Leaderboard, best scores first"></ol>
          <button id="scores-next" class="icon-button" type="button" aria-label="Scroll leaderboard right" aria-controls="leaderboard-scores">›</button>
        </div>
      </section>
    </div>
    <dialog id="driver-dialog" aria-labelledby="driver-dialog-title">
      <form id="driver-form" method="dialog">
        <h2 id="driver-dialog-title"><label for="driver-name">Driver name</label></h2>
        <input id="driver-name" name="driverName" type="text" placeholder="Public nickname"
          autocomplete="nickname" enterkeyhint="done" spellcheck="false"
          aria-describedby="driver-name-description">
        <p id="driver-name-description">Change your name here. This is the name everyone will see on the leaderboards.</p>
        <div class="dialog-actions">
          <button type="button" id="cancel-driver">Cancel</button>
          <button type="submit" class="save-driver">Save</button>
        </div>
      </form>
    </dialog>
    <div id="hint" aria-hidden="true" hidden>
      <span class="hint-hold">〈 Hold 〉</span>
      <span class="hint-release">〈 Release 〉</span>
    </div>
  </main>
</body>
</html>
